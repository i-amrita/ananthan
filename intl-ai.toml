version = 1
locale_dir = "src/i18n/messages"
source = "en"
targets = ["ms", "hi", "es", "ml"]
batch_size = 20

# OpenAI-compatible endpoint. Base URL, model and key all come from .env (gitignored): AI_BASE_URL, AI_MODEL_ID, AI_API_KEY.
# Run `set -a; source .env; set +a` before `fill`. See .env.example.
[provider]
kind = "http"
base_url = "${env:AI_BASE_URL:-http://localhost:8317/v1}"
model = "${env:AI_MODEL_ID:-unset}"
api_key = "${env:AI_API_KEY:-unset}"

[check]
fail_on = ["missing", "stale", "invalid"]

[[checks]]
id = "icu"

[[checks]]
id = "placeholder-parity"
